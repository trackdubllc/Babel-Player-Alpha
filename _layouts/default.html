<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    {% seo %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a1628">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body class="{{ page.body_class | default: '' }}">
    <a id="skip-to-content" class="skip-link" href="#content">Skip to content</a>

    {% assign repo_url = 'https://github.com/' | append: site.repository %}

    <header class="site-topbar" role="banner">
      <div class="site-topbar__inner">
        <a class="site-topbar__brand" href="{{ site.baseurl }}/">
          <img class="site-topbar__logo" src="{{ '/Assets/logo x256.png' | relative_url }}" alt="{{ site.title }} logo">
          <span>{{ site.title }}</span>
        </a>
        <nav class="site-topbar__nav" aria-label="Primary">
          <a href="#workflow">Workflow</a>
          <a href="#why">Features</a>
          <a href="#download">Get started</a>
          <a class="site-topbar__github" href="{{ repo_url }}">GitHub</a>
        </nav>
      </div>
    </header>

    <main id="content" class="main-content main-content--landing" role="main">
      {{ content }}
    </main>

    <footer class="site-footer site-footer--minimal">
      <div class="site-footer__grid">
        <p class="site-footer__owner">
          Built for local-first dubbing workflows. Source available on GitHub.
        </p>
        <p class="site-footer__links">
          <a href="{{ repo_url }}">GitHub</a>
          <span class="site-footer__dot" aria-hidden="true">·</span>
          <a href="{{ repo_url }}/blob/main/THIRD_PARTY_LICENSES.md">Licenses</a>
        </p>
      </div>
    </footer>
  </body>
</html>
